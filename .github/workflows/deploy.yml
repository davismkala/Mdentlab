name: Deploy to Cloudflare Workers

# Requires these repo secrets to be set (Settings → Secrets and variables →
# Actions) before this will succeed — see docs/cloudflare-deploy.md:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_PUBLISHABLE_KEY
#   SUPABASE_URL
#   SUPABASE_PUBLISHABLE_KEY
#   SUPABASE_SERVICE_ROLE_KEY
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Register workers.dev subdomain (idempotent, one-time)
        # The account has no workers.dev subdomain yet, so the deploy step
        # below fails with "Required Worker name missing" / prompts that
        # can't be answered non-interactively. Claiming it via the API is
        # a no-op once it already exists, so this is safe to leave in place.
        run: |
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/subdomain" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"subdomain":"mdentlab"}' | tee /tmp/subdomain-response.json
          echo
          grep -q '"success":true' /tmp/subdomain-response.json || echo "::warning::Subdomain registration did not report success — check the response above."
        continue-on-error: true

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action defaults to an old Wrangler (3.90.0) that can't
          # parse wrangler.jsonc, so it fails with "Required Worker name
          # missing" before it ever reaches Cloudflare. Pin a modern major
          # version that reads wrangler.jsonc correctly.
          wranglerVersion: "4"
          secrets: |
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SERVICE_ROLE_KEY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
